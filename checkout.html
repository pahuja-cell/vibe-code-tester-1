<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shopping bag for Strydë premium streetwear." />
    <title>Strydë | Shopping Bag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Strydë home">
          <span class="brand-mark">S</span>
          <span class="brand-name">Strydë</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#new">New Arrivals</a>
          <a href="products.html">Shop All</a>
          <a href="policies.html">Support</a>
        </nav>

        <div class="nav-actions">
          <a class="nav-link" href="index.html#newsletter">Join</a>
          <a class="nav-link cart-link" href="cart.html">Bag <span id="cart-count">0</span></a>
          <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container cart-layout">
        <div>
          <div class="page-header compact-header">
            <p class="eyebrow">Your bag</p>
            <h1>Shopping cart</h1>
          </div>
          <div id="cart-items" class="cart-items"></div>
        </div>

        <aside class="checkout-panel">
          <h2>Order summary</h2>
          <div class="summary-row"><span>Subtotal</span><strong id="subtotal">$0</strong></div>
          <div class="summary-row"><span>Shipping</span><strong id="shipping-total">$0</strong></div>
          <div class="summary-row total-row"><span>Total</span><strong id="total-price">$0</strong></div>
          <a href="checkout.html" class="btn btn-primary full-width">Proceed to checkout</a>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> Strydë</p>
        <div class="footer-links">
          <a href="products.html">Shop</a>
          <a href="policies.html#shipping">Shipping</a>
          <a href="policies.html#returns">Returns</a>
        </div>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
