<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Checkout for Strydë streetwear orders." />
    <title>Strydë | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Strydë home">
          <span class="brand-mark">S</span>
          <span class="brand-name">Strydë</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#new">New Arrivals</a>
          <a href="products.html">Shop All</a>
          <a href="policies.html">Support</a>
        </nav>

        <div class="nav-actions">
          <a class="nav-link" href="index.html#newsletter">Join</a>
          <a class="nav-link cart-link" href="cart.html">Bag <span id="cart-count">0</span></a>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container checkout-wrap">
        <div class="checkout-form-area">
          <div class="page-header compact-header">
            <p class="eyebrow">Checkout</p>
            <h1>Complete your order</h1>
          </div>

          <form id="checkout-form" class="checkout-form">
            <div class="field-row">
              <label>
                First name
                <input type="text" name="firstName" placeholder="Your first name" required />
              </label>
              <label>
                Last name
                <input type="text" name="lastName" placeholder="Your last name" required />
              </label>
            </div>

            <label>
              Email
              <input type="email" name="email" placeholder="you@example.com" required />
            </label>

            <label>
              Shipping address
              <textarea name="address" placeholder="Street address" required></textarea>
            </label>

            <div class="field-row">
              <label>
                City
                <input type="text" name="city" placeholder="City" required />
              </label>
              <label>
                Postal code
                <input type="text" name="postal" placeholder="Postal code" required />
              </label>
            </div>

            <label>
              Payment method
              <select name="paymentMethod" required>
                <option value="Visa">Visa</option>
                <option value="Mastercard">Mastercard</option>
                <option value="PayPal">PayPal</option>
                <option value="Apple Pay">Apple Pay</option>
                <option value="Klarna">Klarna</option>
              </select>
            </label>

            <button class="btn btn-primary full-width" type="submit">Place order</button>
          </form>
        </div>

        <aside class="checkout-panel">
          <h2>Order summary</h2>
          <div id="checkout-summary"></div>
          <div class="summary-row"><span>Subtotal</span><strong id="checkout-subtotal">$0</strong></div>
          <div class="summary-row"><span>Shipping</span><strong id="checkout-shipping">$0</strong></div>
          <div class="summary-row total-row"><span>Total</span><strong id="checkout-total">$0</strong></div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> Strydë</p>
        <div class="footer-links">
          <a href="products.html">Shop</a>
          <a href="policies.html">Support</a>
        </div>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
