<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shop all Strydë premium streetwear essentials." />
    <title>Strydë | Shop All</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Strydë home">
          <span class="brand-mark">S</span>
          <span class="brand-name">Strydë</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#new">New Arrivals</a>
          <a href="index.html#collections">Collections</a>
          <a href="index.html#story">Brand Story</a>
          <a href="products.html" class="active">Shop All</a>
          <a href="policies.html">Support</a>
        </nav>

        <div class="nav-actions">
          <a class="nav-link" href="index.html#newsletter">Join</a>
          <a class="nav-link cart-link" href="cart.html">Bag <span id="cart-count">0</span></a>
          <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="page-header">
          <p class="eyebrow">Shop all</p>
          <h1>Streetwear essentials</h1>
        </div>

        <div class="shop-toolbar">
          <div class="filter-pills" id="filter-pills"></div>
          <div class="sort-box">
            <label for="sort-select">Sort by</label>
            <select id="sort-select">
              <option value="featured">Featured</option>
              <option value="low-high">Price: Low to High</option>
              <option value="high-low">Price: High to Low</option>
            </select>
          </div>
        </div>

        <div id="all-products" class="product-grid shop-grid"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> Strydë</p>
        <div class="footer-links">
          <a href="products.html">Shop</a>
          <a href="policies.html">Shipping</a>
          <a href="policies.html#returns">Returns</a>
        </div>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
